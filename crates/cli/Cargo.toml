[package]
name = "saispace-cli"
version.workspace = true
edition = "2024"

[[bin]]
name = "sai"
path = "src/main.rs"

[dependencies]
saispace-core = { path = "../core" }
saispace-rules = { path = "../rules" }
chrono = { workspace = true }
clap = { version = "4.6", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
